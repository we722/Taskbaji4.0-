
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskbaji</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <ul>
        <li><a href="#" id="dashboard-link">ড্যাশবোর্ড</a></li>
        <li><a href="#" id="start-task-link">টাস্ক শুরু করুন</a></li>
        <li><a href="#" id="withdraw-link">উইথড্র</a></li>
        <li><a href="#" id="history-link">ইতিহাস</a></li>
        <li><a href="#" id="profile-link">প্রোফাইল</a></li>
        <li><a href="#" id="exit-link">বাহির যান</a></li>
      </ul>
    </div>

    <!-- Main content -->
    <div id="content">
      <h1>স্বাগতম Taskbaji-তে</h1>
      <div id="user-info">
        <p id="user-points">পয়েন্ট: 0</p>

      </div>

      <div id="page-content">
        <h2>স্বাগতম Taskbaji!</h2>
        <p>এখানে আপনি টাস্ক সলভ করতে পারেন এবং টাকা উপার্জন করতে পারেন।</p>
      </div>
    </div>

  <script src="script.js"></script>
